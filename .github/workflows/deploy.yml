name: Pet Adoption CI/CD

on:
  workflow_dispatch:

env:
  WAR_FILE: target/spring-petclinic-2.4.2.war
  NEXUS_REPOSITORY: nexus-repo
  NEXUS_GROUP_ID_PATH: Petclinic/spring-petclinic/1.0
  NEXUS_ARTIFACT_NAME: spring-petclinic-1.0.war

jobs:
  build-and-deploy-stage:
    name: Build, Scan, and Deploy Stage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: SonarQube analysis
        run: |
          mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar \
            -Dsonar.host.url="${{ secrets.SONAR_HOST_URL }}" \
            -Dsonar.login="${{ secrets.SONAR_TOKEN }}" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=600

      - name: Dependency Check
        run: |
          echo "Skipping Dependency-Check temporarily to validate the GitHub Actions deployment flow."

      - name: Build WAR artifact
        run: |
          mvn -f pom.xml clean package -DskipTests -Dcheckstyle.skip

      - name: Upload WAR to Nexus
        run: |
          curl -f -u "${{ secrets.NEXUS_USERNAME }}:${{ secrets.NEXUS_PASSWORD }}" \
            --upload-file "${WAR_FILE}" \
            "http://${{ secrets.NEXUS_URL }}/repository/${NEXUS_REPOSITORY}/${NEXUS_GROUP_ID_PATH}/${NEXUS_ARTIFACT_NAME}"

      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ANSIBLE_SSH_KEY }}" > ~/.ssh/ansible_key
          chmod 600 ~/.ssh/ansible_key
          ssh-keygen -y -f ~/.ssh/ansible_key | ssh-keygen -lf - -E sha256

      - name: Test SSH to Ansible
        run: |
          ssh -vvv -i ~/.ssh/ansible_key \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o PreferredAuthentications=publickey \
            -o PubkeyAuthentication=yes \
            "ec2-user@${{ secrets.ANSIBLE_HOST }}" \
            "hostname && whoami"

      - name: Build Docker image with Ansible
        run: |
          ssh -i ~/.ssh/ansible_key \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o PubkeyAuthentication=yes \
            "ec2-user@${{ secrets.ANSIBLE_HOST }}" \
            "ansible-galaxy collection install community.docker && cd /etc/ansible && ansible-playbook /opt/docker/docker-image.yml"

      - name: Run Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_IMAGE }}:latest'
          scanners: 'vuln,secret'
          timeout: '15m'
          format: 'table'
          output: 'trivyimage.txt'
          exit-code: '0'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-report
          path: trivyimage.txt

      - name: Deploy to stage
        run: |
          ssh -i ~/.ssh/ansible_key \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o PubkeyAuthentication=yes \
            "ec2-user@${{ secrets.ANSIBLE_HOST }}" \
            "cd /etc/ansible && ansible-playbook /opt/docker/docker-container.yml"

          ssh -i ~/.ssh/ansible_key \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o PubkeyAuthentication=yes \
            "ec2-user@${{ secrets.ANSIBLE_HOST }}" \
            "cd /etc/ansible && ansible-playbook /opt/docker/newrelic-container.yml"

      - name: Check website availability
        run: |
          sleep 90

          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            --retry 6 \
            --retry-delay 10 \
            --retry-all-errors \
            "${{ secrets.APP_URL }}" || true)

          echo "Website returned HTTP status code: ${RESPONSE}"

          if [ "$RESPONSE" != "200" ]; then
            echo "Website health check failed with status code ${RESPONSE}"
            exit 1
          fi

  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: build-and-deploy-stage
    environment: production

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ANSIBLE_SSH_KEY }}" > ~/.ssh/ansible_key
          chmod 600 ~/.ssh/ansible_key
          ssh-keygen -y -f ~/.ssh/ansible_key | ssh-keygen -lf - -E sha256

      - name: Deploy to production
        run: |
          ssh -i ~/.ssh/ansible_key \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o PubkeyAuthentication=yes \
            "ec2-user@${{ secrets.ANSIBLE_HOST }}" \
            "cd /etc/ansible && ansible-playbook /opt/docker/docker-container.yml"

          ssh -i ~/.ssh/ansible_key \
            -o StrictHostKeyChecking=no \
            -o IdentitiesOnly=yes \
            -o PubkeyAuthentication=yes \
            "ec2-user@${{ secrets.ANSIBLE_HOST }}" \
            "cd /etc/ansible && ansible-playbook /opt/docker/newrelic-container.yml"
